services:


  postgresql:
    build:
      context: ./requirements/postgresql
    container_name: postgresql
    volumes: 
      - postgresql_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - platform_network



  redis:
    build:
      context: ./requirements/redis
    container_name: redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - platform_network

  backend:
    build:
      context: .
      dockerfile: ./requirements/backend/dockerfile
    container_name: backend
    env_file: 
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - platform_network
    volumes:
    - ./backend:/app
    - backend_node_modules:/app/node_modules
    ports:
    - "4000:4000"
    - "51212:51212"
  nextjs:
    build:
      context: .
      dockerfile: ./requirements/nextjs/dockerfile
    container_name: nextjs
    env_file:
      - .env
    volumes:
      - ./app:/app
      - nextjs_node_modules:/app/node_modules
    depends_on:
      - backend   
    ports:
      - "3000:3000"
    networks:
      - platform_network
    
  nginx:
    build:
      context: ./requirements/nginx
    container_name: nginx
    ports:
      - "8443:443"
    #volumes:
    #- postgresql_data:/var/www/html 
    depends_on:
      - nextjs
      - backend
    networks:
      - platform_network 

volumes:
  postgresql_data:
  redis_data:
  nextjs_node_modules:
  backend_node_modules:
  

networks:
  platform_network: