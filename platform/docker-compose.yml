services:


  postgresql:
    build:
      context: ./requirements/postgresql
      dockerfile: dockerfile
    container_name: postgresql
    volumes: 
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - platform_network



  redis:
    build:
      context: ./requirements/redis
      dockerfile: dockerfile
    container_name: redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - platform_network

  backend:
    build:
      context: .
      dockerfile: ./requirements/backend/dockerfile
    container_name: backend
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    networks:
      - platform_network
    # no env_file: secrets (SESSION_SECRET, GitHub credentials, DATABASE_URL)
    # are read from Vault at startup by scripts/with-vault.js
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault-token/backend.token
      REDIS_URL: ${REDIS_URL}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
      - ./backend/prisma.config.ts:/app/prisma.config.ts
      - ./backend/uploads:/app/uploads
      - vault_token:/vault-token:ro
  nextjs:
    build:
      context: .
      dockerfile: ./requirements/nextjs/dockerfile
    container_name: nextjs
    environment:
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      - ./app:/app
      - nextjs_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - platform_network
    
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: dockerfile
    container_name: nginx
    ports:
      - "8444:443"
    #volumes:
    #- postgresql_data:/var/www/html 
    depends_on:
      - nextjs
      - backend
    networks:
      - platform_network 

  backup:
    build:
      context: ./requirements/backup
    container_name: backup
    user: "1000:1000"
    environment:
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      PGHOST: postgresql
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    depends_on:
      postgresql:
        condition: service_healthy
    restart: always
    networks:
      - platform_network

  vault:
    build:
      context: ./requirements/vault
    container_name: vault
    command: ["vault", "server", "-config=/vault/config"]
    volumes:
      - vault_data:/vault/file
    networks:
      - platform_network
    restart: always


  vault-init:
    build:
      context: ./requirements/vault
    container_name: vault-init
    command: ["sh", "/bootstrap.sh"]
    env_file:
      - .env
    volumes:
      - vault_keys:/keys
      - vault_token:/shared
    depends_on:
      - vault
    networks:
      - platform_network
    restart: "no"

volumes:
  postgresql_data:
  redis_data:
  nextjs_node_modules:
  vault_data:
  vault_keys:
  vault_token:
  
networks:
  platform_network: